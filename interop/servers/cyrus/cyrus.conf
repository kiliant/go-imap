START {
  recover       cmd="ctl_cyrusdb -r"
  # idled pushes mailbox changes to IDLE and NOTIFY sessions as they happen.
  # Without it Cyrus falls back to polling every imapidlepoll seconds, which
  # is too slow for the NOTIFY interop test to observe a push.
  idled         cmd="idled"
}

SERVICES {
  imap          cmd="imapd -U 30" listen="imap" prefork=1 maxchild=100
}

EVENTS {
  checkpoint    cmd="ctl_cyrusdb -c" period=30
}
