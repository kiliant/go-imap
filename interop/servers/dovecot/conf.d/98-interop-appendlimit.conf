# Dovecot advertises APPENDLIMIT (RFC 7889) only when the quota plugin reports
# a per-message size limit, and that comes from quota_mail_size. Without it,
# Cyrus was the only server in the matrix advertising APPENDLIMIT, and a
# capability exercised against one server cannot be marked verified.
#
# The count driver with no quota_storage_size or quota_message_count imposes no
# storage limit, so nothing else in the suite is constrained. imap_quota is
# deliberately not enabled: it would advertise QUOTA and silently widen what
# the matrix runs against Dovecot, which is a separate decision.
#
# The limit must stay above the largest message any interop test appends —
# the 5 MiB streaming check in imapclient is the current maximum.
mail_plugins {
  quota = yes
}
quota_mail_size = 64M
quota "User quota" {
  driver = count
}
