# Exercise the password mechanisms implemented by imapclient.  USER_PASSWORD
# remains a {PLAIN} value supplied by the profile, which Dovecot needs in
# order to derive the CRAM and SCRAM credentials.
auth_mechanisms = plain cram-md5 scram-sha-256

# T12's SASLprep diagnostic (interop/saslprep) needs a second account whose
# password differs from the single global USER_PASSWORD, so it gets its own
# passwd-file passdb with a byte-exact, non-normalized password. This file
# loads before the base image's conf.d/auth.conf (alphabetically "99-..."
# sorts before "auth.conf"), so this passdb is tried first; static (defined
# there, driven by USER_PASSWORD) remains the fallback for every other user,
# including interop@example.test.
#
# Do NOT add result_failure = return-fail to this block. Dovecot 2.4's
# default (result_failure = continue) is required for interop@example.test:
# an unknown-user lookup against passwd-file reports the same result as a
# wrong-password lookup, so return-fail would make interop@example.test
# (absent from this file) fail outright instead of falling through to the
# static passdb. Verified empirically while building this profile: with
# return-fail set, PLAIN/CRAM-MD5/SCRAM-SHA-256 auth for interop@example.test
# broke immediately.
passdb passwd-file {
  passwd_file_path = /etc/dovecot/saslprep-passwd
}
