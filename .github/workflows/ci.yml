name: CI

# Everything that must be green before a change lands. The container-backed
# interop matrix and the long fuzz campaign live in interop.yml and
# fuzz-long.yml: they need a container runtime or hours of CPU, and a gate that
# slow stops being a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The module has no dependencies, so there is nothing to download and nothing
  # a proxy could substitute. Failing closed is cheaper than discovering later
  # that a dependency arrived unnoticed.
  GOFLAGS: -mod=readonly

  # CI tools are pinned. They are not module requirements — see
  # check-no-dependencies.sh — but `@latest` still means an upstream release can
  # turn main red with no commit here, and apidiff in particular is the gate
  # CLAUDE.md calls the deliverable. A gate that changes underneath you is not a
  # gate. Bumping these is a commit, which is the point.
  #
  # Keep these values identical to the sibling go-smtp repository's ci.yml.
  STATICCHECK_VERSION: v0.7.0
  APIDIFF_VERSION: v0.0.0-20260709172345-9ea1abe57597

  # The toolchain the single-version jobs use. The test matrix below is separate
  # and deliberately wider.
  GO_VERSION: '1.26.x'

jobs:
  test:
    # Floor and ceiling. The lower entry must equal the `go` directive in
    # go.mod — testing above the floor only leaves the declared floor
    # unverified, and a user on the version we advertise finds the breakage
    # instead of CI. The upper entry is the newest release, so a toolchain
    # regression surfaces here rather than in a bug report. If go.mod's floor
    # moves, move this matrix in the same commit.
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is pinned rather than -latest so a runner-image rollout is a
        # deliberate bump. macos stays floating: Apple's images age out fast
        # enough that a pin becomes a dead label sooner than it becomes useful.
        os: [ubuntu-24.04, macos-latest]
        go: ['1.24.x', '1.26.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # No dependencies means no module cache worth restoring, and a cache
          # miss on a dependency-free module is pure latency.
          cache: false
      # Per module, not `./...` from the root: `./...` stops at the module
      # boundary, so once imapserver became its own module a root-only run
      # covered none of it and still reported success.
      - name: go build
        run: |
          for dir in $(.github/scripts/modules.sh); do
            echo "::group::go build $dir"
            (cd "$dir" && go build ./...)
            echo "::endgroup::"
          done
      - name: go test -race
        # Not -short: the examples/ compile gate and the API surface walk in
        # api_surface_test.go both skip under -short, and the examples are the
        # only thing that compiles examples/**, whose files all carry
        # `//go:build ignore` and are therefore invisible to `go build ./...`.
        run: |
          for dir in $(.github/scripts/modules.sh); do
            echo "::group::go test $dir"
            (cd "$dir" && go test -race -count=1 ./...)
            echo "::endgroup::"
          done

  vet:
    name: vet, staticcheck, gofmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: |
          for dir in $(.github/scripts/modules.sh); do
            echo "::group::go vet $dir"
            (cd "$dir" && go vet ./...)
            echo "::endgroup::"
          done

      # The tagged variants are the point of this job, not an extra. Interop
      # test files are excluded from an untagged `go vet ./...`, so a vet job
      # that omits the tags reports clean while the tagged build has findings —
      # which is exactly how a `testing.Output requires go1.25` violation
      # survived unnoticed. Type-checking only; no container runtime needed.
      - name: go vet -tags=interop
        run: |
          for dir in $(.github/scripts/modules.sh); do
            echo "::group::go vet -tags=interop $dir"
            (cd "$dir" && go vet -tags=interop ./...)
            echo "::endgroup::"
          done

      - name: go vet -tags='interop interop_emulated'
        run: |
          for dir in $(.github/scripts/modules.sh); do
            echo "::group::go vet -tags='interop interop_emulated' $dir"
            (cd "$dir" && go vet -tags='interop interop_emulated' ./...)
            echo "::endgroup::"
          done

      - name: install staticcheck (${{ env.STATICCHECK_VERSION }})
        # From a scratch directory: `go install pkg@version` is module-aware and
        # ignores the surrounding go.mod, but running it elsewhere makes that
        # independence obvious rather than a thing you have to know.
        run: |
          cd "$(mktemp -d)"
          GOFLAGS= go install \
            "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"

      - name: staticcheck
        run: |
          for dir in $(.github/scripts/modules.sh); do
            echo "::group::staticcheck $dir"
            (
              cd "$dir"
              "$(go env GOPATH)/bin/staticcheck" ./...
              "$(go env GOPATH)/bin/staticcheck" -tags=interop ./...
              "$(go env GOPATH)/bin/staticcheck" -tags='interop interop_emulated' ./...
            )
            echo "::endgroup::"
          done

      # go.work is in the list because a stray `go work use` is exactly as
      # capable of changing what gets built as an edit to a go.mod is.
      - name: tools left the module files alone
        run: |
          git diff --exit-code -- go.mod go.sum go.work go.work.sum \
            $(.github/scripts/modules.sh | sed 's:$:/go.mod:;s:^\./::' ) \
            $(.github/scripts/modules.sh | sed 's:$:/go.sum:;s:^\./::' )

  supply-chain:
    # The zero-dependency policy, mechanised. Without this assertion the policy
    # erodes on the first convenient import and nothing notices.
    name: zero dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: .github/scripts/check-no-dependencies.sh

  fuzz-smoke:
    # 60 s per target on every pull request. Sharded because discovery finds 61
    # targets and 61 minutes is not a pull-request gate. FUZZ_PARALLEL=1: the
    # deadline artifact documented in .github/scripts/fuzz.sh is caused by
    # oversubscription, and hosted runners have few cores.
    # No custom `name:`. A matrix expression in a job name is not expanded when
    # the job is skipped — the matrix is never expanded either — so the run
    # summary rendered the literal text `fuzz-smoke ${{ matrix.shard }}/4` on
    # every push. Letting GitHub append the matrix value gives `fuzz-smoke (0)`
    # when it runs and a clean `fuzz-smoke` when it does not.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 4
      FUZZ_PARALLEL: 1
      FUZZ_OUT: ${{ github.workspace }}/fuzz-out
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: .github/scripts/fuzz.sh 60s
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-shard-${{ matrix.shard }}
          path: fuzz-out/
          retention-days: 7

  apidiff:
    name: apidiff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # apidiff needs the tag history to find the previous tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: run apidiff
        env:
          APIDIFF_OUT: ${{ github.workspace }}/apidiff-out
        run: .github/scripts/apidiff.sh
      - name: comment on the pull request
        # Best effort. A pull request from a fork gets a read-only token, so the
        # comment fails there; the report is also written to the job summary,
        # which is always readable.
        #
        # The script edits its previous comment instead of adding one per push.
        # A ten-push pull request otherwise accumulates ten API reports, nine of
        # them stale, and the reviewer has to work out which is current.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -s apidiff-out/report.md ] || exit 0
          .github/scripts/comment-apidiff.sh apidiff-out/report.md "$PR_NUMBER"

  ci-required:
    # Single fan-in gate for branch protection. The alternative is requiring
    # every matrix leg (test × go × os, fuzz-smoke × shard) by name in the
    # branch protection UI, which means re-editing that list by hand every
    # time a Go version, OS, or shard count changes. This job is the only one
    # branch protection needs to require; it stays in place as the matrices
    # above grow or shrink.
    #
    # Runs only for pull requests: branch protection is the only thing that
    # needs this gate, and a push to main isn't gated by branch protection at
    # all, so re-running it there is pure waste.
    #
    # `always()` is still required alongside that event check: a `needs:` job
    # is skipped by default if any dependency failed, which would make this
    # check vanish instead of reporting red. `apidiff` and `fuzz-smoke` are
    # also conditionally skipped by their own `if:` on a pull request — that
    # must count as pass, not failure, hence checking specifically for
    # 'failure' and 'cancelled' rather than "everything succeeded".
    #
    # Keep this job's `needs:` list identical in spirit to the sibling
    # go-smtp repository's ci.yml (job names differ where the job sets do).
    name: CI required
    if: always() && github.event_name == 'pull_request'
    needs: [test, vet, supply-chain, fuzz-smoke, apidiff]
    runs-on: ubuntu-24.04
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed:" >&2
            echo '${{ toJSON(needs) }}' >&2
            exit 1
          fi
